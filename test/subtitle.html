<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>字幕翻译测试（模拟 YouTube 结构）</title>
    <style>
      body {
        margin: 0;
        background: #0f0f0f;
        color: #ddd;
        font: 14px/1.6 -apple-system, 'Segoe UI', sans-serif;
      }
      .html5-video-player {
        position: relative;
        width: 900px;
        height: 506px;
        margin: 40px auto;
        background: #1b1b1b;
        border-radius: 12px;
        overflow: hidden;
      }
      video {
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #2a2a2a, #161616);
        display: block;
      }
      #ytp-caption-window-container {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 14%;
        text-align: center;
        pointer-events: none;
      }
      .caption-window {
        display: inline-block;
        max-width: 80%;
        padding: 2px 10px;
        background: rgba(8, 8, 8, 0.75);
        border-radius: 4px;
      }
      .captions-text {
        display: block;
      }
      .caption-visual-line {
        display: block;
      }
      .ytp-caption-segment {
        color: #fff;
        font-size: 21px;
        line-height: 1.4;
      }
      .ytp-right-controls {
        position: absolute;
        right: 12px;
        bottom: 42px;
        display: flex;
        align-items: center;
        gap: 4px;
        height: 36px;
      }
      .ytp-button {
        width: 36px;
        height: 36px;
        border: 0;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.08);
        color: #eee;
        font: 12px/1 sans-serif;
        cursor: pointer;
      }
      .tip {
        width: 900px;
        margin: 0 auto;
        color: #999;
      }
    </style>
  </head>
  <body>
    <div class="html5-video-player">
      <video muted playsinline></video>

      <div id="ytp-caption-window-container">
        <div class="caption-window fading">
          <span class="captions-text">
            <span class="caption-visual-line">
              <span class="ytp-caption-segment">But if these four contestants</span>
            </span>
          </span>
        </div>
        <div class="caption-window current">
          <span class="captions-text">
            <span class="caption-visual-line">
              <span class="ytp-caption-segment" id="cue">eat everything inside,</span>
            </span>
          </span>
        </div>
      </div>

      <div class="ytp-right-controls">
        <button class="ytp-button" title="原生按钮占位">CC</button>
      </div>
    </div>

    <p class="tip">模仿 YouTube 的字幕层级和控制栏，验证：译文插进字幕框、右下角出现插件按钮。</p>
  </body>
</html>
